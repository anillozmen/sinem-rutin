<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anıl'ım Halleder">

<title>Anıl'ım Halleder</title>
<style>
:root{--bg:#f6efe4;--card:#fffdf8;--pink:#ff8fb1;--soft:#e9dfd0;--text:#3a2e28;--muted:#9a8b7d;--shadow:0 8px 24px #3a2e2814}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:8px;margin:4px 0 20px}
h1,h2,.msg,.serif{font-family:ui-serif,'New York',Georgia,serif}
h1{font-size:28px;font-weight:600;margin:0;flex:1}
.pill{background:var(--soft);border-radius:999px;padding:8px 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cat{background:var(--card);border-radius:26px;padding:18px 16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:132px}
.cat:active{transform:scale(.97)}
.cat .emo{font-size:38px;margin-bottom:4px}
.cat .name{font:600 18px ui-serif,'New York',Georgia,serif}
.cat .count{color:var(--muted);font-size:14px}
.add{border:2px dashed var(--soft);background:transparent;box-shadow:none;color:var(--muted)}
.cat.add{align-items:center;justify-content:center;font-size:16px}
.tasks{display:flex;flex-wrap:wrap;gap:10px}
.task{background:var(--card);border-radius:999px;padding:12px 18px;box-shadow:var(--shadow);font-size:16px}
.task small{color:var(--muted);font-size:11px;margin-left:6px}
.task.off{opacity:.45}
.opt.pop{animation:pop .6s ease forwards;pointer-events:none}
.task.pop{animation:grow .8s ease forwards;pointer-events:none}
@keyframes grow{0%{background:var(--pink);color:#fff}40%{background:var(--pink);color:#fff;transform:scale(1.3)}100%{background:var(--pink);color:#fff;transform:scale(1.6);opacity:0}}
.heart{position:fixed;pointer-events:none;color:var(--pink);font-size:22px;transform:translate(-50%,-50%);animation:heart .9s ease-out forwards;z-index:9}
@keyframes heart{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.5);opacity:0}}
@keyframes pop{0%{background:var(--pink);color:#fff}35%{background:var(--pink);color:#fff;transform:scale(1.12)}100%{background:var(--pink);color:#fff;transform:scale(0);opacity:0}}
.task.add{box-shadow:none}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:17px;width:100%}
.welcome{display:flex;flex-direction:column;justify-content:center;gap:24px;min-height:80vh}
.msg{font-size:21px;line-height:1.5;text-align:center;margin:0}
.go{align-self:center;background:var(--pink);color:#fff;border-radius:999px;padding:12px 24px;font-size:17px}
.call{display:flex;align-items:center;gap:14px;background:#1e1a18;color:#fff;text-decoration:none;padding:18px;border-radius:28px;box-shadow:0 10px 28px #1e1a1840;margin-bottom:28px}
.avatar{width:64px;height:64px;border-radius:50%;border:3px solid #fff3;background:#4a3f39 center/cover;display:grid;place-items:center;font:600 26px ui-serif,Georgia,serif;flex:none}
.call-t{flex:1;display:flex;flex-direction:column;gap:2px}
.call-t b{font:600 23px ui-serif,'New York',Georgia,serif}
.call-t i{color:#fffa;font-size:15px}
.phone{width:56px;height:56px;border-radius:50%;background:#34c759;display:grid;place-items:center;font-size:24px;flex:none}
.love{display:flex;justify-content:space-between;margin-bottom:28px}
.love button,.love span{font-size:26px;color:var(--soft);padding:0}
.love .on{color:var(--pink)}
.love button[data-water]{opacity:.3}
.love button[data-water].on{opacity:1}
.confetti{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:9;animation:fall 3s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.memory{font:italic 17px ui-serif,'New York',Georgia,serif;text-align:center;color:var(--muted);margin:0;white-space:pre-wrap}
.week{display:flex;justify-content:space-between;margin:-14px 0 28px;text-align:center;font-size:17px}
.week small{display:block;color:var(--muted);font-size:12px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.quick .task{font-size:15px}
.sec{font-size:13px;letter-spacing:.14em;margin:0;color:var(--muted);font-family:inherit}
.sub{font:italic 22px ui-serif,'New York',Georgia,serif;margin:4px 0 14px}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{color:#fff;border-radius:26px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:var(--shadow);min-height:150px;justify-content:center}
.mood:active{transform:scale(.97)}
.mood:last-child:nth-child(odd){grid-column:span 2}
.mood .emo,.flow-emo{font-size:44px}
.mood b{font:600 18px ui-serif,'New York',Georgia,serif}
.mood small{opacity:.8;font-size:13px}
.flow{position:fixed;inset:0;overflow:auto;color:#fff;display:flex;flex-direction:column;gap:18px;text-align:center;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.flow-top{display:flex;justify-content:space-between;align-items:center;font-size:15px;opacity:.85}
.flow-top button{font-size:22px;width:40px;height:40px;border-radius:50%;background:#fff2}
.flow h2{font-size:28px;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#fff;color:var(--text);border-radius:24px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 8px 20px #0002}
.opt span{font-size:40px}
.opt small{font-size:13px;font-weight:400;opacity:.65}
.busy{pointer-events:none}
.sent{background:var(--bg);color:var(--text);justify-content:center}
.sent h2{font-size:30px}
.sent ul{list-style:none;padding:0;margin:0;line-height:1.8;color:var(--muted)}
.sent ul b{color:var(--text)}
.fun{font:italic 20px ui-serif,'New York',Georgia,serif;margin:0}
.black{background:#1e1a18;color:#fff;border-radius:999px;padding:16px;font-size:17px;margin-top:12px}
.grid.big{margin-top:24px;grid-template-columns:1fr 1fr}
.big .cat{min-height:170px}
.big .cat:last-child:nth-child(odd){grid-column:span 2;min-height:120px}
.sect{margin-bottom:26px}
.sect .sec{text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sect .sec .pill{font-size:13px;padding:4px 10px;letter-spacing:0}
.yay{text-align:center;margin:0 0 24px}
textarea{width:100%;min-height:120px;font:inherit;font-size:17px;padding:14px;border:0;border-radius:20px;background:var(--card);box-shadow:var(--shadow);color:inherit;outline:none;resize:vertical;-webkit-user-select:text;user-select:text}
.notes{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.note{background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);white-space:pre-wrap;font-size:16px;line-height:1.4}
.note small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.note.on{outline:2px solid var(--pink)}
.edit-cat{margin-top:24px;width:100%;text-align:center;color:var(--muted);padding:12px}
dialog{border:0;border-radius:24px;padding:20px;width:min(92vw,360px);color:var(--text);background:var(--card)}
dialog::backdrop{background:#3a2e2840}
dialog h2{margin:0 0 14px;font-size:19px}
dialog select{width:100%;font-size:17px;padding:12px;border:2px solid var(--soft);border-radius:14px;margin-bottom:12px;background:var(--card);color:inherit}
input{-webkit-user-select:text;user-select:text}
.err{color:#d9536f;text-align:center;margin:0;min-height:1.2em}
.field,dialog input[type=text]{width:100%;font-size:17px;padding:12px;border:2px solid var(--soft);border-radius:14px;margin-bottom:12px;outline:none;color:inherit}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.actions .del{margin-right:auto;color:#d9536f}
.actions .ok{background:var(--pink);color:#fff;border-radius:999px;padding:8px 18px}
</style>
</head>

const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
// Görev, yapıldığı dönemin anahtarını tutar; dönem değişince kendiliğinden tekrar görünür.
function periodKey(type, d = new Date()) {
  if (type === 'w') d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7); // o haftanın pazartesisi
  return ymd(d);
}
const isDone = task => task.done === periodKey(task.type);
const left = cs => cs.reduce((n, cat) => n + cat.tasks.filter(x => !isDone(x)).length, 0);
const leftLabel = n => n ? n + ' görev kaldı' : 'Hepsi tamam 💖';
const catBtn = (id, emoji, name, label) => `<button class="cat" data-view="${id}"><span class="emo">${esc(emoji)}</span><span class="name">${esc(name)}</span><span class="count">${label}</span></button>`;
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const $ = id => document.getElementById(id);
const today = () => (new Date().getDay() + 6) % 7;
const dailyCats = () => data.cats.filter(c => c.type === 'd');
const weekCats = () => data.cats.filter(c => c.type === 'w');
const todayCats = () => [...dailyCats(), ...weekCats().filter(c => c.day === today())];
const findTask = id => { for (const cat of data.cats) { const task = cat.tasks.find(x => x.id === id); if (task) return [cat, task]; } };
const dayNo = d => Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
const YAY = 'Bugün harikaydın aşkım, gerisi senin zamanın 💕';
// Tarihle saklanır; gün değişince 0 sayılır (gece sıfırlanır).
const loveToday = () => data.love?.d === ymd(new Date()) ? data.love.n : 0;
const loveRow = tag => `<div class="love">${Array.from({ length: 10 }, (_, i) => `<${tag} data-love="${i + 1}" class="${i < loveToday() ? 'on' : ''}">♥</${tag}>`).join('')}</div>`;

const waterToday = () => data.water?.d === ymd(new Date()) ? data.water.n : 0;
const waterRow = () => `<div class="love">${Array.from({ length: WATER }, (_, i) => `<button data-water="${i + 1}" class="${i < waterToday() ? 'on' : ''}">💧</button>`).join('')}</div>`;
const memories = () => [...data.notes, ...(data.msgs || [])].filter(x => x.star);
const isBday = () => ymd(new Date()).slice(5) === BDAY;
function confetti() {
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.textContent = ['🎉', '🎂', '🎈', '💖', '✨'][i % 5];
    c.style.cssText = `left:${Math.random() * 100}vw;animation-delay:${Math.random() * 2}s`;
    c.addEventListener('animationend', () => c.remove());
    document.body.append(c);
  }
}
const DAYS_SHORT = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
const daysAgo = d => dayNo(new Date()) - dayNo(new Date(d + 'T00:00'));
// Bugün bittiyse bugünden, bitmediyse dünden geriye kesintisiz biten gün sayısı.
function streak() {
  const set = new Set(data.days || []), d = new Date();
  if (!set.has(ymd(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// Bugünün bütün görevleri bittiyse günü kaydeder, geri alınınca siler.
function markDay() {
  const d = ymd(new Date());
  data.days = (data.days || []).filter(x => x !== d).slice(-60);
  if (!left(todayCats())) data.days.push(d);
}
const streakText = () => streak() ? `🔥 ${streak()} gündür rutin tamam` : '';
function specialDays() {
  const now = new Date(), t0 = dayNo(now);
  const rows = SPECIAL.map(([name, date]) => {
    const [d, m, y] = date.split('-').map(Number).reverse();
    let next = new Date(now.getFullYear(), m - 1, d);
    if (dayNo(next) < t0) next = new Date(now.getFullYear() + 1, m - 1, d);
    const left = dayNo(next) - t0, age = next.getFullYear() - y;
    return `<div class="note"><small>${name}${y ? ` · ${age}. yıl` : ''}</small>${left ? left + ' gün kaldı' : 'Bugün! 🎉'}</div>`;
  });
  return `<h2 class="sec">ÖZEL GÜNLER</h2><div class="notes" style="margin:10px 0 28px">
    <div class="note"><small>Sevgili olalı</small>${t0 - dayNo(new Date(SPECIAL[0][1] + 'T00:00'))} gün 💕</div>${rows.join('')}</div>`;
}
const bubbleLabel = k => { const d = data.bubble?.[k]; return d ? (daysAgo(d) ? daysAgo(d) + ' gün önce' : 'bugün') : 'henüz yok'; };
function loveWeek() {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    out.push(`<span><small>${DAYS_SHORT[(d.getDay() + 6) % 7]}</small>${data.loveLog?.[ymd(d)] ?? (data.love?.d === ymd(d) ? data.love.n : '–')}</span>`);
  }
  return `<div class="week">${out.join('')}</div>`;
}

const sharedLeft = () => shared.filter(x => !x.done).length;
function sharedBox() {
  return `<div class="tasks">
    ${shared.filter(x => !x.done).map(x => `<button class="task" data-sh="${x.id}">${esc(x.text)}</button>`).join('')}

  </div>${shared.some(x => x.done) ? '<button class="edit-cat" id="clearShared">Yapılanları listeden kaldır</button>' : ''}`;
}
// Liste ikimizin; aynı anda yazılırsa biri diğerini ezmesin diye işlem (transaction) ile değişir.
async function sharedOp(fn) {
  if (demo) { shared = fn(shared); return render(); }
  try { await db.runTransaction(async tx => { const d = await tx.get(SHARED()); tx.set(SHARED(), { items: fn(d.exists ? d.data().items : []) }); }); }
  catch { alert('Kaydedilemedi, internet bağlantını kontrol et.'); }
}
function watchShared() {
  unsubShared?.(); unsubShared = null; shared = [];
  if (demo || !user) return;
  unsubShared = SHARED().onSnapshot(d => {
    shared = d.exists ? d.data().items : [];
    // Sinem'de yalnız ana ekran ve liste ekranı yeniden çizilir (görev animasyonu, taslak, açık pencere bozulmasın).
    if ($('dlg').open || welcome || inbox || celebrate || flow) return;
    if (viewer || lite || view === null || view === 'b') render();
  }, () => {});
}

function section(cat, title) {
  return `<section class="sect">
    <h2 class="sec">${title}${editing && cat.type === 'd' ? ` <button class="pill" data-editcat="${cat.id}">✏️</button>` : ''}</h2>

      ${editing ? cat.tasks.filter(isDone).map(x => `<button class="task off" data-undo="${x.id}">↩️ ${esc(x.name)}</button>`).join('') : ''}
      <button class="task add" data-add="${cat.id}">+ Görev</button>
    </div>
  </section>`;
}

function hearts(el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 10; i++) {
    const h = document.createElement('span'), a = i / 10 * 2 * Math.PI;
    h.className = 'heart';
    h.textContent = '♥';
    h.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;--x:${Math.cos(a) * (r.width / 2 + 30)}px;--y:${Math.sin(a) * (r.height / 2 + 40)}px`;
    h.addEventListener('animationend', () => h.remove());
    document.body.append(h);
  }
}

function ask({ title, name = '', emoji, sec, canDelete }, done) {
  const dlg = $('dlg');
  $('dTitle').textContent = title;
  $('dName').value = name;
  $('dEmoji').hidden = emoji === undefined;
  $('dEmoji').value = emoji || '';
  $('dSec').hidden = !sec;
  if (sec) $('dSec').innerHTML = sec.cats.map(c => `<option value="${c.id}"${c.id === sec.value ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  $('dDel').hidden = !canDelete;
  dlg.onclose = () => {
    const vals = { name: $('dName').value.trim(), emoji: $('dEmoji').value.trim(), sec: $('dSec').value };
    if (dlg.returnValue === 'ok' && vals.name) done('ok', vals);
    if (dlg.returnValue === 'del') done('del');
    dlg.returnValue = '';
  };
  dlg.showModal();
}

const sameType = cat => data.cats.filter(c => c.type === cat.type);
const catById = id => data.cats.find(c => c.id === id);

document.addEventListener('click', e => {
  // Numara kodda durmaz (depo herkese açık); ilk dokunuşta bir kez sorulur, Sinem'in verisine kaydedilir.
  if (e.target.closest('#call') && !data.phone) {
    e.preventDefault();
    const p = (prompt("Anıl'ın telefon numarası (bir kez sorulur):") || '').replace(/[^\d+]/g, '');
    if (p) { data.phone = p; save(); render(); }
    return;
  }
  const el = e.target.closest('button');
  if (!el || el.closest('dialog')) return;

  if (el.id === 'logout') { if (confirm('Çıkış yapılsın mı?')) auth.signOut(); }
  else if (el.id === 'setPass') {
    const p = prompt('Yeni şifre (en az 6 karakter):');
    if (!p) return;
    if (p.length < 6) return alert('Şifre en az 6 karakter olmalı.');
    auth.currentUser.updatePassword(p)
      .then(() => alert('Şifre kaydedildi. Kullanıcı adın: ' + (lite ? 'anil' : 'admin')))
      .catch(() => alert('Şifre değiştirilemedi. Çıkış yapıp yeniden gir, sonra tekrar dene.'));
  }
  else if (el.dataset.view) { view = el.dataset.view; render(); scrollTo(0, 0); }
  else if (el.id === 'back') { view = null; editing = false; noteId = null; render(); }
  else if (el.id === 'toggle') { editing = !editing; render(); }
  else if (el.id === 'closeWelcome') { welcome = false; data.seen = ymd(new Date()); save(); render(); }
  else if (el.id === 'closeYay') { celebrate = false; render(); }
  else if (el.dataset.love) { data.love = { d: ymd(new Date()), n: +el.dataset.love }; data.loveLog = Object.fromEntries(Object.entries({ ...data.loveLog, [data.love.d]: data.love.n }).slice(-14)); save(); render(); clearTimeout(loveTimer); loveTimer = setTimeout(sendLove, 4000); hearts(document.querySelector(`[data-love="${el.dataset.love}"]`)); }
  else if (el.dataset.water) { const n = +el.dataset.water; data.water = { d: ymd(new Date()), n: n === waterToday() ? n - 1 : n }; save(); render(); }
  else if (el.dataset.star) { const x = (data.msgs || []).find(m => msgKey(m) === el.dataset.star); if (!x) return; x.star = !x.star; save(); render(); }
  else if (el.id === 'starNote') { const n = data.notes.find(x => x.id === noteId); n.star = !n.star; const v = $('note').value; save(); render(); $('note').value = v; }   // yazılan taslak kaybolmasın
  else if (el.id === 'addShared') ask({ title: 'Birlikte ne yapalım? 🧡' }, (_, v) => sharedOp(items => [...items, { id: uid(), text: v.name, by: viewer || lite ? 'Anıl' : 'Sinem', done: false }]));
  else if (el.dataset.sh) sharedOp(items => items.map(i => i.id === el.dataset.sh ? { ...i, done: !i.done } : i));
  else if (el.id === 'clearShared') { if (confirm('Yapılanlar listeden kaldırılsın mı?')) sharedOp(items => items.filter(i => !i.done)); }
  else if (el.id === 'closeInbox') { const now = new Date().toISOString(); inbox.forEach(x => x.seen = now); inbox = null; save(); render(); }
  else if (el.dataset.quick) sendToSinem(el.dataset.quick);
  else if (el.id === 'sendMsg') { const v = $('anilMsg').value.trim(); if (v) sendToSinem(v, true); }
  else if (el.dataset.bubble) {
    const [k, n] = BUBBLE.find(b => b[0] === el.dataset.bubble);
    if (!confirm(`"${n}" bugün olarak işaretlensin mi?`)) return;
    data.bubble = { ...data.bubble, [k]: ymd(new Date()) }; save(); render();
  }
  else if (el.dataset.mood) { flow = { m: MOODS[el.dataset.mood], picks: [] }; render(); }
  else if (el.id === 'closeFlow') { flow = null; render(); }
  else if (el.dataset.opt) {
    if (el.dataset.free) { ask({ title: 'Ne yemek istersin? 🍽️' }, (_, v) => pick(v.name)); return; }
    el.parentNode.classList.add('busy');
    el.classList.add('pop');
    el.addEventListener('animationend', () => pick(el.dataset.opt), { once: true });
  }
  else if (el.id === 'addCat') {
    ask({ title: 'Yeni bölüm', emoji: '' }, (_, v) => { data.cats.push({ id: uid(), name: v.name, emoji: v.emoji, type: 'd', tasks: [] }); save(); render(); });
  }
  else if (el.dataset.editcat) {
    const cat = catById(el.dataset.editcat);
    ask({ title: 'Bölümü düzenle', name: cat.name, emoji: cat.emoji, canDelete: true }, (a, v) => {
      if (a === 'del') { if (!confirm(`"${cat.name}" ve içindeki tüm görevler silinsin mi?`)) return; data.cats = data.cats.filter(c => c !== cat); }
      else { cat.name = v.name; cat.emoji = v.emoji; }
      save(); render();
    });
  }
  else if (el.dataset.add) {
    const cat = catById(el.dataset.add);
    ask({ title: 'Yeni görev', sec: { cats: sameType(cat), value: cat.id } }, (_, v) => { catById(v.sec).tasks.push(t(v.name, cat.type)); markDay(); save(); render(); });
  }
  else if (el.dataset.undo) { findTask(el.dataset.undo)[1].done = null; markDay(); save(); render(); }
  else if (el.dataset.task) {
    const [cat, task] = findTask(el.dataset.task);
    if (editing) {
      ask({ title: 'Görevi düzenle', name: task.name, sec: { cats: sameType(cat), value: cat.id }, canDelete: true }, (a, v) => {
        if (a === 'del') cat.tasks = cat.tasks.filter(x => x !== task);
        else {
          task.name = v.name;
          if (v.sec !== cat.id) { cat.tasks = cat.tasks.filter(x => x !== task); catById(v.sec).tasks.push(task); }
        }
        markDay(); save(); render();
      });
    } else {
      task.done = periodKey(task.type);
      markDay();
      save();
      const yay = todayCats().includes(cat) && !left(todayCats());
      el.classList.add('pop');
      hearts(el);
      el.addEventListener('animationend', () => { celebrate = yay; render(); }, { once: true });
    }
  }
  else if (el.id === 'saveNote') {
    const text = $('note').value.trim();
    if (!text) return;
    const n = data.notes.find(x => x.id === noteId);
    if (n) n.text = text; else data.notes.push({ id: uid(), date: new Date().toISOString(), text });
    noteId = null; save(); render();
  }
  else if (el.dataset.note) { noteId = el.dataset.note; render(); scrollTo(0, 0); }
  else if (el.id === 'cancelNote') { noteId = null; render(); }
  else if (el.id === 'delNote') {
    if (!confirm('Bu not silinsin mi?')) return;
    data.notes = data.notes.filter(x => x.id !== noteId); noteId = null; save(); render();
  }
});

// Kalplere art arda basılınca tek bildirim gitsin diye beklenir; uygulama kapanırsa hemen gönderilir.
let loveTimer = 0;
function sendLove() {
  if (!loveTimer) return;
  clearTimeout(loveTimer); loveTimer = 0;
  fetch(NTFY, { method: 'POST', body: `Sinem seni bugün ${loveToday()} / 10 seviyor ❤️`, keepalive: true }).catch(() => {});
}

async function pick(o) {
  const f = flow;
  f.picks.push(o);
  if (f.picks.length === f.m.steps.length) {
    try {
      const r = await fetch(NTFY, { method: 'POST', body: f.m.msg(...f.picks) });
      if (!r.ok) throw r;
      f.sent = true;
      data.lastMood = { text: f.m.msg(...f.picks), date: new Date().toISOString() }; save();
    } catch { alert('Gönderilemedi, internet bağlantını kontrol et.'); f.picks.pop(); }
  }
  if (flow === f) render();
}

// Uygulama tekrar açıldığında listeyi tazele; o günün ilk açılışıysa karşılamayı göster.
// Günlük notlar ekranı yazılan taslak kaybolmasın diye yeniden çizilmez.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) sendLove();
  if (!document.hidden && viewer) return loadSinem();
  if (!document.hidden && lite) return loadLite();
  if (lite) return;
  if (!document.hidden) checkMsgs();
  if (document.hidden || $('dlg').open || view === 'j') return;
  if (data.seen !== ymd(new Date())) { welcome = true; flow = null; }
  render();
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'login') return;
  e.preventDefault();
  $('lErr').textContent = '';
  auth.signInWithEmailAndPassword(lc($('lUser').value.trim()).replace(/ı/g, 'i') + DOMAIN, $('lPass').value)
    .catch(() => $('lErr').textContent = 'Kullanıcı adı ya da şifre yanlış.');
});

async function sendToSinem(text, typed) {
  if (sending) return;   // çift dokunuş iki mesaj göndermesin
  sending = true;
  const m = { id: uid(), text, date: new Date().toISOString() };
  try {
    try {
      // Kalıcı yol. source:'server' çevrimdışıyken beklemek yerine hata versin diye.
      const d = await INBOX().get({ source: 'server' });
      await INBOX().set({ msgs: [...(d.exists ? d.data().msgs : []), m].slice(-30) });
    } catch {
      // Firestore kuralı yoksa ntfy (12 saat saklar). Başlık header'da olmaz: Türkçe harf/emoji fetch'i patlatır.
      const r = await fetch(`${NTFY_SINEM}?title=${encodeURIComponent("Anıl'dan 💌")}`, { method: 'POST', body: text });
      if (!r.ok) throw r;
      m.id = (await r.json()).id;
    }
    try { localStorage.setItem(SENT_KEY, JSON.stringify([...sentList(), m].slice(-10))); } catch {}
    if (typed && $('anilMsg')) $('anilMsg').value = '';
    render();
  } catch { alert('Gönderilemedi, internet bağlantını kontrol et.'); }
  finally { sending = false; }
}

// Anıl'ın yeni mesajlarını çeker, Sinem'in verisine kalıcı yazar ve pop-up'ta gösterir.
async function checkMsgs() {
  if (demo || viewer || lite || !user || !loaded || checking) return;
  checking = true;
  try {
    const got = [];
    let since = data.msgSince, fsSince = data.fsSince || '';
    try {
      const r = await fetch(`${NTFY_SINEM}/json?poll=1&since=${data.msgSince || '12h'}`);
      const lines = (await r.text()).split('\n').filter(Boolean).map(l => JSON.parse(l)).filter(m => m.event === 'message');
      got.push(...lines.map(m => ({ id: m.id, text: m.message, date: new Date(m.time * 1000).toISOString() })));
      if (lines.length) since = lines.at(-1).id;
    } catch {}
    try {
      // Kural eklenmediyse izin hatası verir, sessizce geçilir. Eskiler tarihle elenir (Sinem'de silinmiş olanlar geri gelmesin).
      const d = await INBOX().get();
      const ms = (d.exists ? d.data().msgs : []).filter(m => m.date > fsSince);
      got.push(...ms.map(m => ({ id: m.id, text: m.text, date: m.date })));
      if (ms.length) fsSince = ms.at(-1).date;
    } catch {}
    const have = new Set((data.msgs || []).map(m => m.id));
    const fresh = got.filter(m => !have.has(m.id) && have.add(m.id)).sort((a, b) => a.date.localeCompare(b.date));
    if (!fresh.length) return;
    const all = [...(data.msgs || []), ...fresh], recent = all.filter(x => !x.star).slice(-20);
    data.msgs = all.filter(x => x.star || recent.includes(x));   // anı yapılanlar silinmez
    data.msgSince = since; data.fsSince = fsSince;
    save();
    inbox = [...(inbox || []), ...fresh];
    if (!$('dlg').open && view !== 'j') render();   // günlük taslağı silinmesin
  } catch {} finally { checking = false; }
}

// Sade ekran yalnız özeti okur; Sinem'in günlüğüne ve görevlerine kural gereği erişemez.
async function loadLite() {
  try { const d = await SUMMARY().get(); data = { ...SEED, ...(d.exists ? JSON.parse(d.data().json) : {}) }; }
  catch { alert("Sinem'in verisi alınamadı."); }
  render();
}

async function loadSinem() {
  try { data = JSON.parse((await db.collection('users').doc(SINEM_UID).get()).data().json); }
  catch { alert("Sinem'in verisi alınamadı."); return render(); }
  pushSummary();
  render();
}

function show(d) { data = d; welcome = data.seen !== ymd(new Date()); render(); }

if (demo) {
  user = { uid: 'demo' };
  let d = null;
  try { d = JSON.parse(localStorage.getItem(cacheKey())); } catch {}
  show(d || SEED);
}

auth.onAuthStateChanged(async u => {
  if (demo) return;
  user = u; loaded = false; inbox = null;
  view = null; editing = false; flow = null;
  viewer = u?.email === VIEWER; lite = u?.email === LITE;
  watchShared();
  if (!u && !linkTried && (LINK_KEY || ADMIN_KEY)) {
    linkTried = true;   // yalnız kimse girişli değilken ve bir kez: çıkış yapınca ya da başka hesaptayken araya girmez
    auth.signInWithEmailAndPassword(LINK_KEY ? LITE : VIEWER, LINK_KEY || ADMIN_KEY).catch(() => {});
  }
  if (!u) return render();
  if (viewer) return loadSinem();
  if (lite) return loadLite();
  let local = null;
  // İlk girişte giriş öncesi telefondaki veri (eski anahtar) buluta taşınır.
  try { local = JSON.parse(localStorage.getItem(cacheKey()) || localStorage.getItem(KEY)); } catch {}
  if (local) show(local);
  let cloud;
  try { const d = await remote().get(); cloud = d.exists ? JSON.parse(d.data().json) : null; }
  catch { if (!local) show(SEED); loaded = true; return; }   // çevrimdışı: telefondaki veriyle devam
  const lt = local?.updated || 0, ct = cloud?.updated || 0;
  if (cloud && (!local || ct > lt)) show(cloud);
  else if (!cloud || lt > ct) { if (!local) show(SEED); save(); }
  loaded = true;
  pushSummary();
  checkMsgs();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
