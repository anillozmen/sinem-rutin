<style>
:root{--bg:#f6efe4;--card:#fffdf8;--pink:#ff8fb1;--soft:#e9dfd0;--text:#3a2e28;--muted:#9a8b7d;--shadow:0 8px 24px #3a2e2814}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:8px;margin:4px 0 20px}
h1,h2,.msg,.serif{font-family:ui-serif,'New York',Georgia,serif}
h1{font-size:28px;font-weight:600;margin:0;flex:1}
.pill{background:var(--soft);border-radius:999px;padding:8px 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cat{background:var(--card);border-radius:26px;padding:18px 16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:132px}
.cat:active{transform:scale(.97)}
.cat .emo{font-size:38px;margin-bottom:4px}
.cat .name{font:600 18px ui-serif,'New York',Georgia,serif}
.cat .count{color:var(--muted);font-size:14px}
.add{border:2px dashed var(--soft);background:transparent;box-shadow:none;color:var(--muted)}
.cat.add{align-items:center;justify-content:center;font-size:16px}
.tasks{display:flex;flex-wrap:wrap;gap:10px}
.task{background:var(--card);border-radius:999px;padding:12px 18px;box-shadow:var(--shadow);font-size:16px}
.task small{color:var(--muted);font-size:11px;margin-left:6px}
.task.off{opacity:.45}
.opt.pop{animation:pop .6s ease forwards;pointer-events:none}
.task.pop{animation:grow .8s ease forwards;pointer-events:none}
@keyframes grow{0%{background:var(--pink);color:#fff}40%{background:var(--pink);color:#fff;transform:scale(1.3)}100%{background:var(--pink);color:#fff;transform:scale(1.6);opacity:0}}
.heart{position:fixed;pointer-events:none;color:var(--pink);font-size:22px;transform:translate(-50%,-50%);animation:heart .9s ease-out forwards;z-index:9}
@keyframes heart{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.5);opacity:0}}
@keyframes pop{0%{background:var(--pink);color:#fff}35%{background:var(--pink);color:#fff;transform:scale(1.12)}100%{background:var(--pink);color:#fff;transform:scale(0);opacity:0}}
.task.add{box-shadow:none}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:17px;width:100%}
.welcome{display:flex;flex-direction:column;justify-content:center;gap:24px;min-height:80vh}
.msg{font-size:21px;line-height:1.5;text-align:center;margin:0}
.go{align-self:center;background:var(--pink);color:#fff;border-radius:999px;padding:12px 24px;font-size:17px}
.call{display:flex;align-items:center;gap:14px;background:#1e1a18;color:#fff;text-decoration:none;padding:18px;border-radius:28px;box-shadow:0 10px 28px #1e1a1840;margin-bottom:28px}
.avatar{width:64px;height:64px;border-radius:50%;border:3px solid #fff3;background:#4a3f39 center/cover;display:grid;place-items:center;font:600 26px ui-serif,Georgia,serif;flex:none}
.call-t{flex:1;display:flex;flex-direction:column;gap:2px}
.call-t b{font:600 23px ui-serif,'New York',Georgia,serif}
.call-t i{color:#fffa;font-size:15px}
.phone{width:56px;height:56px;border-radius:50%;background:#34c759;display:grid;place-items:center;font-size:24px;flex:none}
.sec{font-size:13px;letter-spacing:.14em;margin:0;color:var(--muted);font-family:inherit}
.sub{font:italic 22px ui-serif,'New York',Georgia,serif;margin:4px 0 14px}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{color:#fff;border-radius:26px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:var(--shadow);min-height:150px;justify-content:center}

.mood:last-child:nth-child(odd){grid-column:span 2}
.mood .emo,.flow-emo{font-size:44px}
.mood b{font:600 18px ui-serif,'New York',Georgia,serif}
.mood small{opacity:.8;font-size:13px}

.flow-top{display:flex;justify-content:space-between;align-items:center;font-size:15px;opacity:.85}
.flow-top button{font-size:22px;width:40px;height:40px;border-radius:50%;background:#fff2}
.flow h2{font-size:28px;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#fff;color:var(--text);border-radius:24px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 8px 20px #0002}
.opt span{font-size:40px}
.busy{pointer-events:none}
.sent{background:var(--bg);color:var(--text);justify-content:center}
.sent h2{font-size:30px}
.sent ul{list-style:none;padding:0;margin:0;line-height:1.8;color:var(--muted)}
.sent ul b{color:var(--text)}
.fun{font:italic 20px ui-serif,'New York',Georgia,serif;margin:0}
.black{background:#1e1a18;color:#fff;border-radius:999px;padding:16px;font-size:17px;margin-top:12px}
.grid.big{margin-top:24px;grid-template-columns:1fr 1fr}
.big .cat{min-height:170px}
.big .cat:last-child:nth-child(odd){grid-column:span 2;min-height:120px}
.sect{margin-bottom:26px}
.sect .sec{text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sect .sec .pill{font-size:13px;padding:4px 10px;letter-spacing:0}
.yay{text-align:center;margin:0 0 24px}
textarea{width:100%;min-height:120px;font:inherit;font-size:17px;padding:14px;border:0;border-radius:20px;background:var(--card);box-shadow:var(--shadow);color:inherit;outline:none;resize:vertical;-webkit-user-select:text;user-select:text}
.notes{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.note{background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);white-space:pre-wrap;font-size:16px;line-height:1.4}
.note small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.note.on{outline:2px solid var(--pink)}
.edit-cat{margin-top:24px;width:100%;text-align:center;color:var(--muted);padding:12px}
dialog{border:0;border-radius:24px;padding:20px;width:min(92vw,360px);color:var(--text);background:var(--card)}
dialog::backdrop{background:#3a2e2840}
dialog h2{margin:0 0 14px;font-size:19px}
dialog select{width:100%;font-size:17px;padding:12px;border:2px solid var(--soft);border-radius:14px;margin-bottom:12px;background:var(--card);color:inherit}
input{-webkit-user-select:text;user-select:text}
.err{color:#d9536f;text-align:center;margin:0;min-height:1.2em}
.field,dialog input[type=text]{width:100%;font-size:17px;padding:12px;border:2px solid var(--soft);border-radius:14px;margin-bottom:12px;outline:none;color:inherit}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.actions .del{margin-right:auto;color:#d9536f}
.actions .ok{background:var(--pink);color:#fff;border-radius:999px;padding:8px 18px}
</style>
</head>

// Görev, yapıldığı dönemin anahtarını tutar; dönem değişince kendiliğinden tekrar görünür.
function periodKey(type, d = new Date()) {
  if (type === 'w') d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7); // o haftanın pazartesisi

}

function section(cat, title) {

  </section>`;
}

function hearts(el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 10; i++) {
    const h = document.createElement('span'), a = i / 10 * 2 * Math.PI;
    h.className = 'heart';
    h.textContent = '♥';
    h.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;--x:${Math.cos(a) * (r.width / 2 + 30)}px;--y:${Math.sin(a) * (r.height / 2 + 40)}px`;
    h.addEventListener('animationend', () => h.remove());
    document.body.append(h);
  }
}

}

      ${c.tasks.map(x => `<span class="task${isDone(x) ? '' : ' off'}">${isDone(x) ? '✅' : '⬜'} ${esc(x.name)}</span>`).join('')}</div></section>`;
    const all = todayCats().flatMap(c => c.tasks);
    app.innerHTML = `<header><h1>Sinem'in Günü 🌸</h1></header>
      <p class="sub">Bugün ${all.filter(isDone).length} / ${all.length} görev tamam</p>
      ${dailyCats().map(c => list(c, `${esc(c.emoji || '')} ${esc(c.name)}`)).join('')}
      ${weekCats().map(c => list(c, c.name + (c.day === today() ? ' · Bugün' : ''))).join('')}
      <h2 class="sec">GÜNLÜĞÜ</h2>
      <div class="notes">${newestFirst(data.notes).map(x => `<div class="note"><small>${fmt(x.date)}</small>${esc(x.text)}</div>`).join('') || '<div class="empty">Henüz not yok</div>'}</div>
      <button class="edit-cat" id="logout">Çıkış yap</button>`;
    return;
  }
  if (welcome) {
    app.innerHTML = `<div class="welcome">
      <p class="msg">${MESSAGES[dayNo(new Date()) % MESSAGES.length]}</p>
      <button class="go" id="closeWelcome">Ana sayfaya geç ›</button>
    </div>`;
    return;
  }
  if (celebrate) {
    app.innerHTML = `<div class="flow sent">
      <div class="flow-emo">🎉</div>
      <h2>${YAY}</h2>
      <button class="black" id="closeYay">Tamam</button>
    </div>`;
    return;
  }
  if (flow) {
    const { m, picks } = flow;
    if (flow.sent) {
      app.innerHTML = `<div class="flow sent">
        <div class="flow-emo">${m.emoji}</div>
        <h2>Anıl'a iletildi!</h2>
        <ul>${picks.map((x, i) => `<li>${m.steps[i][0]} <b>${x}</b></li>`).join('')}</ul>
        <p class="fun">${m.fun}</p>
        <button class="black" id="closeFlow">Tamam</button>
      </div>`;
      return;
    }
    const [q, opts] = m.steps[picks.length];
    app.innerHTML = `<div class="flow" style="background:${m.color}">
      <div class="flow-top"><span>${picks.length + 1} / ${m.steps.length}</span><button id="closeFlow" aria-label="Kapat">✕</button></div>
      <div class="flow-emo">${m.emoji}</div>
      <h2>${q}</h2>
      <div class="opts">${opts.map(([e, o]) => `<button class="opt" data-opt="${o}"><span>${e}</span>${o}</button>`).join('')}</div>
    </div>`;
    return;
  }
  if (view === 'd') {
    app.innerHTML = page('Günlük Görevler', `
      ${!editing && !left(todayCats()) ? `<p class="fun yay">${YAY}</p>` : ''}
      ${dailyCats().map(c => section(c, `${esc(c.emoji || '')} ${esc(c.name)}`)).join('')}
      ${weekCats().filter(c => c.day === today()).map(c => section(c, `📅 Bugün · ${c.name}`)).join('')}
      ${editing ? '<button class="edit-cat" id="addCat">+ Bölüm ekle</button>' : ''}`);
    return;
  }
  if (view === 'w') {
    app.innerHTML = page('Haftalık Görevler', weekCats().map(c => section(c, c.name + (c.day === today() ? ' · Bugün' : ''))).join(''));
    return;
  }
  if (view === 'j') {
    const n = data.notes.find(x => x.id === noteId);
    app.innerHTML = page('Günlüğüm 📖', `
      <textarea id="note" placeholder="Bugün aklından neler geçti?">${n ? esc(n.text) : ''}</textarea>
      <div class="actions">
        ${n ? '<button class="del" id="delNote">Sil</button><button id="cancelNote">Vazgeç</button>' : ''}
        <button class="ok" id="saveNote">${n ? 'Güncelle' : 'Kaydet'}</button>
      </div>
      <div class="notes">
        ${newestFirst(data.notes).map(x => `<button class="note${x.id === noteId ? ' on' : ''}" data-note="${x.id}"><small>${fmt(x.date)}</small>${esc(x.text)}</button>`).join('') || '<div class="empty">Henüz not yok</div>'}
      </div>`);
    return;
  }
  view = null;
  app.innerHTML = `<header><h1>Merhaba Sinem 🌸</h1></header>
    <a class="call" href="tel:${PHONE}">
      <span class="avatar">A</span><!-- fotoğraf gelince: style="background-image:url(anil.jpg)" ve harfi sil -->
      <span class="call-t"><b>Anıl'ı Ara</b><i>Bir tık – yanındayım</i></span>
      <span class="phone">📞</span>
    </a>
    <h2 class="sec">DUYGU MODLARI</h2>
    <p class="sub">Ne hissediyorsun aşkım?</p>
    <div class="moods">${MOODS.map((m, i) => `<button class="mood" data-mood="${i}" style="background:${m.color}">
      <span class="emo">${m.emoji}</span><b>${m.name}</b><small>${m.sub}</small></button>`).join('')}</div>
    <div class="grid big">
      ${catBtn('d', '☀️', 'Günlük Görevler', leftLabel(left(todayCats())))}
      ${catBtn('w', '📅', 'Haftalık Görevler', leftLabel(left(weekCats())))}
      ${catBtn('j', '📖', 'Günlüğüm', data.notes.length + ' not')}
    </div>
    <button class="edit-cat" id="logout">Çıkış yap</button>`;
}

function ask({ title, name = '', emoji, sec, canDelete }, done) {
  const dlg = $('dlg');
  $('dTitle').textContent = title;
  $('dName').value = name;
  $('dEmoji').hidden = emoji === undefined;
  $('dEmoji').value = emoji || '';
  $('dSec').hidden = !sec;
  if (sec) $('dSec').innerHTML = sec.cats.map(c => `<option value="${c.id}"${c.id === sec.value ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  $('dDel').hidden = !canDelete;
  dlg.onclose = () => {
    const vals = { name: $('dName').value.trim(), emoji: $('dEmoji').value.trim(), sec: $('dSec').value };
    if (dlg.returnValue === 'ok' && vals.name) done('ok', vals);
    if (dlg.returnValue === 'del') done('del');
    dlg.returnValue = '';
  };
  dlg.showModal();
}

const sameType = cat => data.cats.filter(c => c.type === cat.type);
const catById = id => data.cats.find(c => c.id === id);

document.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el || el.closest('dialog')) return;

  if (el.id === 'logout') { if (confirm('Çıkış yapılsın mı?')) auth.signOut(); }
  else if (el.dataset.view) { view = el.dataset.view; render(); scrollTo(0, 0); }
  else if (el.id === 'back') { view = null; editing = false; noteId = null; render(); }
  else if (el.id === 'toggle') { editing = !editing; render(); }
  else if (el.id === 'closeWelcome') { welcome = false; data.seen = ymd(new Date()); save(); render(); }
  else if (el.id === 'closeYay') { celebrate = false; render(); }
  else if (el.dataset.mood) { flow = { m: MOODS[el.dataset.mood], picks: [] }; render(); }
  else if (el.id === 'closeFlow') { flow = null; render(); }
  else if (el.dataset.opt) {
    el.parentNode.classList.add('busy');
    el.classList.add('pop');
    el.addEventListener('animationend', () => pick(el.dataset.opt), { once: true });
  }
  else if (el.id === 'addCat') {
    ask({ title: 'Yeni bölüm', emoji: '' }, (_, v) => { data.cats.push({ id: uid(), name: v.name, emoji: v.emoji, type: 'd', tasks: [] }); save(); render(); });
  }
  else if (el.dataset.editcat) {
    const cat = catById(el.dataset.editcat);
    ask({ title: 'Bölümü düzenle', name: cat.name, emoji: cat.emoji, canDelete: true }, (a, v) => {
      if (a === 'del') { if (!confirm(`"${cat.name}" ve içindeki tüm görevler silinsin mi?`)) return; data.cats = data.cats.filter(c => c !== cat); }
      else { cat.name = v.name; cat.emoji = v.emoji; }
      save(); render();
    });
  }
  else if (el.dataset.add) {
    const cat = catById(el.dataset.add);
    ask({ title: 'Yeni görev', sec: { cats: sameType(cat), value: cat.id } }, (_, v) => { catById(v.sec).tasks.push(t(v.name, cat.type)); save(); render(); });
  }
  else if (el.dataset.undo) { findTask(el.dataset.undo)[1].done = null; save(); render(); }
  else if (el.dataset.task) {
    const [cat, task] = findTask(el.dataset.task);
    if (editing) {
      ask({ title: 'Görevi düzenle', name: task.name, sec: { cats: sameType(cat), value: cat.id }, canDelete: true }, (a, v) => {
        if (a === 'del') cat.tasks = cat.tasks.filter(x => x !== task);
        else {
          task.name = v.name;
          if (v.sec !== cat.id) { cat.tasks = cat.tasks.filter(x => x !== task); catById(v.sec).tasks.push(task); }
        }
        save(); render();
      });
    } else {
      task.done = periodKey(task.type);
      save();
      const yay = todayCats().includes(cat) && !left(todayCats());
      el.classList.add('pop');
      hearts(el);
      el.addEventListener('animationend', () => { celebrate = yay; render(); }, { once: true });
    }
  }
  else if (el.id === 'saveNote') {
    const text = $('note').value.trim();
    if (!text) return;
    const n = data.notes.find(x => x.id === noteId);
    if (n) n.text = text; else data.notes.push({ id: uid(), date: new Date().toISOString(), text });
    noteId = null; save(); render();
  }
  else if (el.dataset.note) { noteId = el.dataset.note; render(); scrollTo(0, 0); }
  else if (el.id === 'cancelNote') { noteId = null; render(); }
  else if (el.id === 'delNote') {
    if (!confirm('Bu not silinsin mi?')) return;
    data.notes = data.notes.filter(x => x.id !== noteId); noteId = null; save(); render();
  }
});

async function pick(o) {
  const f = flow;
  f.picks.push(o);
  if (f.picks.length === f.m.steps.length) {
    try {
      const r = await fetch(NTFY, { method: 'POST', body: f.m.msg(...f.picks) });
      if (!r.ok) throw r;
      f.sent = true;
    } catch { alert('Gönderilemedi, internet bağlantını kontrol et.'); f.picks.pop(); }
  }
  if (flow === f) render();
}

// Uygulama tekrar açıldığında listeyi tazele; o günün ilk açılışıysa karşılamayı göster.
// Günlük notlar ekranı yazılan taslak kaybolmasın diye yeniden çizilmez.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && viewer) return loadSinem();
  if (document.hidden || $('dlg').open || view === 'j') return;
  if (data.seen !== ymd(new Date())) { welcome = true; flow = null; }
  render();
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'login') return;
  e.preventDefault();
  $('lErr').textContent = '';
  auth.signInWithEmailAndPassword($('lUser').value.trim().toLowerCase() + DOMAIN, $('lPass').value)
    .catch(() => $('lErr').textContent = 'Kullanıcı adı ya da şifre yanlış.');
});

async function loadSinem() {
  try { data = JSON.parse((await db.collection('users').doc(SINEM_UID).get()).data().json); }
  catch { alert("Sinem'in verisi alınamadı."); }
  render();
}

function show(d) { data = d; welcome = data.seen !== ymd(new Date()); render(); }

if (demo) {
  user = { uid: 'demo' };
  let d = null;
  try { d = JSON.parse(localStorage.getItem(cacheKey())); } catch {}
  show(d || SEED);
}

auth.onAuthStateChanged(async u => {
  if (demo) return;
  user = u;
  view = null; editing = false; flow = null;
  viewer = u?.email === VIEWER;
  if (!u) return render();
  if (viewer) return loadSinem();
  let local = null;
  // İlk girişte giriş öncesi telefondaki veri (eski anahtar) buluta taşınır.
  try { local = JSON.parse(localStorage.getItem(cacheKey()) || localStorage.getItem(KEY)); } catch {}
  if (local) show(local);
  let cloud;
  try { const d = await remote().get(); cloud = d.exists ? JSON.parse(d.data().json) : null; }
  catch { if (!local) show(SEED); return; }   // çevrimdışı: telefondaki veriyle devam
  const lt = local?.updated || 0, ct = cloud?.updated || 0;
  if (cloud && (!local || ct > lt)) show(cloud);
  else if (!cloud || lt > ct) { if (!local) show(SEED); save(); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
